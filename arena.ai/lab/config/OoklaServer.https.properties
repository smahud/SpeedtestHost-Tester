# Arena laboratory configuration -- OoklaServer, TLS mode on the SAME port 8080.
#
# Identical to OoklaServer.http.properties except that a laboratory-issued
# certificate/key is configured.  @CERT_DIR@ is replaced with the absolute
# path of lab/certs by lab/scripts/start-daemon.sh.
#
# With an explicit certificate the daemon initialises a TLS context and then
# performs protocol sniffing on the first bytes of each accepted socket, so
# port 8080 serves plain HTTP, HTTPS, raw NetGauge TCP and WSS concurrently.

OoklaServer.tcpPorts = 8080
OoklaServer.udpPorts = 8080
OoklaServer.httpPorts = 8080
OoklaServer.useIPv4 = true
OoklaServer.useIPv6 = false
OoklaServer.addresses = 127.0.0.1

OoklaServer.allowedDomains = *

OoklaServer.enableAutoUpdate = false
OoklaServer.ssl.useLetsEncrypt = false

OoklaServer.clientAuthToken.denyInvalid = true
OoklaServer.websocket.frameSizeLimitBytes = 5242880
OoklaServer.http.maxHeadersSize = 65536

openSSL.server.certificateFile = @CERT_DIR@/fullchain.pem
openSSL.server.privateKeyFile = @CERT_DIR@/server.key
openSSL.server.minimumTLSProtocol = 1.2

logging.loggers.app.name = Application
logging.loggers.app.channel.class = ConsoleChannel
logging.loggers.app.channel.pattern = %Y-%m-%d %H:%M:%S [%P - %I] [%p] %t
logging.loggers.app.level = information
