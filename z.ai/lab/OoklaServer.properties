# OoklaServer.properties — konfigurasi simulasi lokal (lab)
# Binary: OoklaServer 2.11.5.2 2026-06-04.1737.7d0993d (stable, x86_64 static musl)
# Kendala lab: hanya port 8080 yang bisa diuji -> TCP/UDP/HTTP/HTTPS/WS semuanya di 8080.

# ---- Port (netgauge TCP/UDP + HTTP + HTTPS + WebSocket, semua multiplex di port yang sama) ----
OoklaServer.tcpPorts = 8080
OoklaServer.udpPorts = 8080

# ---- Jaringan ----
# Ikut mendengarkan IPv6 (::1) selain IPv4 (127.0.0.1)
OoklaServer.useIPv6 = true

# ---- Akses ----
# Default: semua domain diizinkan ("*"). Untuk membatasi:
# OoklaServer.allowedDomains = *.ookla.com, *.speedtest.net
# Filter user-agent buruk (TIDAK diaktifkan di sini agar identik dgn server user;
# catatan: server produksi Ookla memfilter klien tanpa UA -> koneksi di-reset)
# OoklaServer.userAgentFilterEnabled = true

# ---- Client auth token ----
# Tolak token autentikasi klien yang invalid/expired (klien legacy tanpa token tetap boleh)
OoklaServer.clientAuthToken.denyInvalid = true

# ---- Auto update ----
# Dimatikan untuk lingkungan lab (default di produksi: true)
OoklaServer.enableAutoUpdate = false

# ---- SSL ----
# Sertifikat self-signed buatan sendiri (menonaktifkan Let's Encrypt otomatis)
openSSL.server.certificateFile = ${application.dir}/cert.pem
openSSL.server.privateKeyFile = ${application.dir}/key.pem
openSSL.server.minimumTLSProtocol = 1.2

# ---- Logging ----
# Console
logging.loggers.app.name = Application
logging.loggers.app.channel.class = ConsoleChannel
logging.loggers.app.channel.pattern = %Y-%m-%d %H:%M:%S [%P - %I] [%p] %t
logging.loggers.app.level = information

# File (rotasi 10 MB, archive timestamp, kompres, simpan 10)
logging.loggers.file.name = FileApp
logging.loggers.file.channel.class = FileChannel
logging.loggers.file.channel.pattern = %Y-%m-%d %H:%M:%S [%P - %I] [%p] %t
logging.loggers.file.channel.path = ${application.dir}/ooklaserver.log
logging.loggers.file.channel.rotation = 10M
logging.loggers.file.channel.archive = timestamp
logging.loggers.file.channel.compress = true
logging.loggers.file.channel.purgeCount = 10
logging.loggers.file.level = information
